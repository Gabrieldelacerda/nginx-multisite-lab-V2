services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: nginx-multisite
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/site1.conf:/etc/nginx/conf.d/site1.conf:ro
      - ./docker/nginx/site2.conf:/etc/nginx/conf.d/site2.conf:ro
      - ./sites/site1:/var/www/site1:ro
      - ./sites/site2:/var/www/site2:ro
    restart: unless-stopped
    logging:
      driver: fluentd
      options:
        fluentd-address: localhost:24224
        fluentd-async: "true"
        tag: nginx
